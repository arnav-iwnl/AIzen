services:
  - type: web
    name: aizen-vulnerable-site
    env: node
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: PORT
        value: 5000
      - key: AIZEN_BACKEND_URL
        value: https://aizen-backend.onrender.com
      - key: AIZEN_FRONTEND_URL
        value: https://aizen-frontend.onrender.com
      - key: NODE_ENV
        value: production