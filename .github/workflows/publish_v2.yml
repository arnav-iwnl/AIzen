name: Publish v2 ONNX

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  export-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ml/requirements.txt

      - name: Run ONNX export (if checkpoint present)
        run: |
          python -c "import os,sys; sys.path.insert(0,'v2'); from export.export_onnx import export; sys.exit(export())" || true

      - name: Validate model files
        run: |
          ls -l v2/runtime || true
          python -c "import json,sys; print('meta exists' if __import__('pathlib').Path('v2/runtime/meta.json').exists() else 'no meta'); sys.exit(0)"

      - name: Publish to Hugging Face (runtime + datasets)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python ml/publish_to_hf.py --repo dr0wzy/aizen-siem --token "$HF_TOKEN" --include-data --include-source-datasets
